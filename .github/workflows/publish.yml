name: Publish Release & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  webapp-build:
    uses: ./.github/workflows/build-webapp.yml
    with:
      upload-artifact: true

  firmwares-build:
    uses: ./.github/workflows/build-firmwares.yml
    with:
      firmware-selection: "all"
      upload-artifact: true

  combine-artifacts:
    needs: [webapp-build, firmwares-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for Build
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm install typescript @types/node tsx --ignore-scripts

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Assemble Pages Directory
        run: |
          mkdir -p public/firmware

          if [ -d "all-artifacts/webapp" ]; then
            cp -r all-artifacts/webapp/* public/
          fi

          for dir in all-artifacts/firmware_*; do
            if [ -d "$dir" ]; then
              artifact_name=$(basename "$dir" | sed 's/^firmware_//')
              mkdir -p "public/firmware/$artifact_name"
              cp -r "$dir"/* "public/firmware/$artifact_name/"
            fi
          done

      - name: Generate Firmwares Manifest
        run: npx tsx scripts/firmware_builder/GenerateManifest.ts public/firmware/

      - name: Upload Pages Artifact (GitHub)
        if: env.ACT != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Upload Pages Artifact (Act)
        if: env.ACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: public/
