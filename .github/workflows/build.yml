# .github/workflows/build.yml
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit SHA or ref to checkout"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build submodule
        run: |
          cd src/lib/ossm-ble-web
          npm install
          npm run build

      - name: Type check
        run: npm run check

      - name: Run production build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/
