name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  webapp-build:
    uses: ./.github/workflows/build-webapp.yml
    with:
      upload-artifact: false

  firmwares-build:
    uses: ./.github/workflows/build-firmwares.yml
    with:
      firmware-selection: "changed"
      upload-artifact: false
